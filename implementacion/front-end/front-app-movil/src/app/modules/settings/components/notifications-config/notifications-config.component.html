<div class="page flex h-full flex-col bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
  <main class="flex-1 overflow-y-auto max-w-2xl mx-auto w-full p-4 pb-20">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-6 space-y-8">
      <section class="space-y-4">
        <div class="flex justify-between items-end">
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Frecuencia Envio Ubicacion</label>
          <span class="text-primary font-bold text-base">{{ locationFrequency }}s</span>
        </div>
        <input type="range" [min]="rangeSettings.ubicacion.min"
              [max]="rangeSettings.ubicacion.max" [step]="rangeSettings.ubicacion.step"
              [(ngModel)]="locationFrequency" title="Frecuencia de envio de ubicacion" aria-label="Frecuencia de envio de ubicacion" class="w-full" />
        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
          <span>{{ rangeSettings.ubicacion.min }}s</span>
          <span>{{ rangeSettings.ubicacion.max }}s</span>
        </div>
      </section>

      <section class="space-y-4">
        <div class="flex justify-between items-end">
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Frecuencia Captura Fotos</label>
          <span class="text-primary font-bold text-base">{{ photosFrequency }}s</span>
        </div>
        <input type="range" [min]="rangeSettings.fotos.min"
              [max]="rangeSettings.fotos.max" [step]="rangeSettings.fotos.step"
              [(ngModel)]="photosFrequency" title="Frecuencia de captura de fotos" aria-label="Frecuencia de captura de fotos" class="w-full" />
        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
          <span>{{ rangeSettings.fotos.min }}s</span>
          <span>{{ rangeSettings.fotos.max }}s</span>
        </div>
      </section>

      <section class="space-y-4">
        <div class="flex justify-between items-end">
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Frecuencia Grabacion Audio</label>
          <span class="text-primary font-bold text-base">{{ audioFrequency }}s</span>
        </div>
        <input type="range" [min]="rangeSettings.audio.min"
              [max]="rangeSettings.audio.max" [step]="rangeSettings.audio.step"
              [(ngModel)]="audioFrequency" title="Frecuencia de grabacion de audio" aria-label="Frecuencia de grabacion de audio" class="w-full" />
        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
          <span>{{ rangeSettings.audio.min }}s</span>
          <span>{{ rangeSettings.audio.max }}s</span>
        </div>
      </section>

      <section class="space-y-3 pt-4 border-t border-slate-200 dark:border-slate-700">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mensaje a Enviar</label>
        <textarea
          [(ngModel)]="defaultMessage"
          title="Mensaje de notificacion"
          aria-label="Mensaje de notificacion"
          class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary min-h-[120px] outline-none"
          placeholder="Escriba el contenido del mensaje de notificacion predeterminado..."
        ></textarea>
      </section>
    </div>
  </main>
