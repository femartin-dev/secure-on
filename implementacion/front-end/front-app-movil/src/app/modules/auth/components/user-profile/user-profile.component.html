<!-- Background Video -->
<div class="fixed inset-0 -z-10 overflow-hidden">
  <video autoplay loop muted class="absolute min-w-full min-h-full object-cover">
    <source src="assets/securion-bg-video.mp4" type="video/mp4" />
  </video>
  <div class="absolute inset-0 bg-background-dark/80 backdrop-blur-[2px]"></div>
</div>

<div class="relative flex min-h-screen w-full items-center flex-col overflow-x-hidden mx-auto bg-transparent">
  <header class="flex w-full items-center px-4 py-3 justify-between sticky top-0 z-50 bg-background-dark/95 backdrop-blur-md border-b border-border-dark/30 max-w-[900px]">
    <button type="button" (click)="onBackToMain()" class="text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10 transition-colors" title="Volver al inicio" aria-label="Volver al inicio">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </button>
    <h1 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10 text-white">Mi Perfil</h1>
  </header>

  <main class="flex-1 flex flex-col pb-6 w-full max-w-[900px]">
    <div class="px-4 py-4 sm:px-6">
      <div class="hero-banner w-full h-[140px] rounded-xl bg-cover bg-center relative overflow-hidden shadow-lg border border-border-dark/50">
        <div class="absolute inset-0 bg-gradient-to-r from-primary/80 to-background-dark/80 mix-blend-multiply"></div>
        <div class="absolute inset-0 flex flex-col justify-end p-4">
          <span class="text-xs font-bold uppercase tracking-wider text-white/70">Secure ON</span>
          <h2 class="text-white text-xl font-bold leading-tight">Gestión de Cuenta</h2>
        </div>
      </div>
    </div>

    <section class="px-4 sm:px-6 mb-4">
      <div class="rounded-xl border border-border-dark/50 bg-surface-dark/75 backdrop-blur-sm p-4">
        <h3 class="text-white text-lg font-semibold mb-4">Datos del usuario</h3>

        <form [formGroup]="profileForm" class="grid grid-cols-1 min-[500px]:grid-cols-2 gap-4">
          <div class="flex flex-col w-full">
            <label for="firstName" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Nombre</label>
            <input id="firstName" type="text" formControlName="firstName" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full">
            <label for="lastName" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Apellido</label>
            <input id="lastName" type="text" formControlName="lastName" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full">
            <label for="phone" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Teléfono</label>
            <input id="phone" type="text" formControlName="phone" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full">
            <label for="email" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Email</label>
            <input id="email" type="email" formControlName="email" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full min-[500px]:col-span-2">
            <label for="address" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Dirección</label>
            <input id="address" type="text" formControlName="address" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>
        </form>

        <div class="flex flex-wrap gap-3 mt-4">
          <button *ngIf="!editingProfile" type="button" (click)="onEditProfile()" class="flex items-center justify-center rounded-lg bg-primary hover:bg-blue-800 h-11 px-5 transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
            <span class="text-white text-sm font-bold tracking-wide">Editar datos</span>
          </button>
          <button *ngIf="editingProfile" type="button" (click)="onSaveProfile()" class="flex items-center justify-center rounded-lg bg-primary hover:bg-blue-800 h-11 px-5 transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
            <span class="text-white text-sm font-bold tracking-wide">Guardar</span>
          </button>
          <button *ngIf="editingProfile" type="button" (click)="onCancelEdit()" class="flex items-center justify-center rounded-lg border border-transparent hover:bg-white/5 h-11 px-5 transition-colors text-gray-400 hover:text-white">
            <span class="text-sm font-medium">Cancelar</span>
          </button>
        </div>
      </div>
    </section>

    <section class="px-4 sm:px-6 mb-4">
      <div class="rounded-xl border border-border-dark/50 bg-surface-dark/75 backdrop-blur-sm p-4">
        <h3 class="text-white text-lg font-semibold mb-4">Seguridad</h3>

        <button type="button" (click)="onTogglePasswordChange()" class="flex items-center justify-center rounded-lg border border-border-dark bg-surface-dark/70 hover:bg-surface-dark h-11 px-5 transition-colors text-white">
          <span class="text-sm font-medium">{{ changingPassword ? 'Cancelar cambio de contraseña' : 'Cambiar contraseña' }}</span>
        </button>

        <form *ngIf="changingPassword" [formGroup]="passwordForm" class="grid grid-cols-1 min-[500px]:grid-cols-2 gap-4 mt-4">
          <div class="flex flex-col w-full min-[500px]:col-span-2">
            <label for="oldPassword" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Contraseña actual</label>
            <input id="oldPassword" type="password" formControlName="oldPassword" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full">
            <label for="newPassword" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Nueva contraseña</label>
            <input id="newPassword" type="password" formControlName="newPassword" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <div class="flex flex-col w-full">
            <label for="confirmPassword" class="text-sm font-medium leading-normal pb-2 ml-1 text-white">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-input flex w-full rounded-lg text-white border border-border-dark bg-surface-dark focus:border-primary h-12 px-4" />
          </div>

          <p class="text-xs text-red-400 min-[500px]:col-span-2" *ngIf="passwordError">{{ passwordError }}</p>

          <div class="min-[500px]:col-span-2">
            <button type="button" (click)="onChangePassword()" class="flex items-center justify-center rounded-lg bg-primary hover:bg-blue-800 h-11 px-5 transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
              <span class="text-white text-sm font-bold tracking-wide">Guardar contraseña</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="px-4 sm:px-6 mb-8">
      <div class="rounded-xl border border-red-500/30 bg-red-950/20 backdrop-blur-sm p-4">
        <h3 class="text-red-200 text-lg font-semibold mb-4">Baja de cuenta</h3>

        <div *ngIf="!confirmingDelete">
          <button type="button" (click)="onRequestDelete()" class="flex items-center justify-center rounded-lg bg-red-600 hover:bg-red-700 h-11 px-5 transition-all">
            <span class="text-white text-sm font-bold tracking-wide">Pedir la baja</span>
          </button>
        </div>

        <div *ngIf="confirmingDelete" class="flex flex-col gap-3">
          <p class="text-sm text-red-100">¿Seguro que deseas solicitar la baja de tu cuenta?</p>
          <div class="flex flex-wrap gap-3">
            <button type="button" (click)="onConfirmDelete()" class="flex items-center justify-center rounded-lg bg-red-600 hover:bg-red-700 h-11 px-5 transition-all">
              <span class="text-white text-sm font-bold tracking-wide">Confirmar</span>
            </button>
            <button type="button" (click)="onCancelDelete()" class="flex items-center justify-center rounded-lg border border-transparent hover:bg-white/5 h-11 px-5 transition-colors text-gray-300 hover:text-white">
              <span class="text-sm font-medium">Cancelar</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
