<div class="flex-1 flex flex-col items-center justify-start pt-2 pb-4 px-6 w-full max-w-md mx-auto">

  <!-- Headline -->
  <div class="text-center mb-6 space-y-2">
    <h2 class="text-2xl font-bold leading-tight text-white">Ingrese su PIN</h2>
    <p class="text-white/60 text-base font-medium">{{ pinSubtitle }}</p>
  </div>

  <!-- PIN Indicators -->
  <div class="mb-6 w-full flex justify-center">
    <div *ngIf="!showPin" class="flex gap-6" >
      <div *ngFor="let i of pinDigits"
        [ngClass]="i < pinDigits.length ? 'bg-primary shadow-[0_0_10px_rgba(24,61,170,0.6)]' : 'border-2 border-white/20 bg-transparent'"
        class="w-4 h-4 rounded-full transition-all duration-200">
      </div>
    </div>
    <div *ngIf="showPin" class="flex gap-6 text-white text-lg font-mono tracking-wide">
      <div *ngFor="let i of pinDigits" class="w-6 h-8 flex items-center justify-center rounded-md bg-white/10">
        {{ pinValue.charAt(i) }}
      </div>
    <div class="flex" >
      <button (click)="togglePinValueVisibility()"
        class="text-white/30 hover:text-white transition-colors ml-4">
        <span *ngIf="!showPin" class="material-symbols-outlined text-[28px] text-white/30 ml-4">visibility</span>
        <span *ngIf="showPin" class="material-symbols-outlined text-[28px] text-white/30 ml-4">visibility_off</span>
      </button>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="w-full bg-red-900/30 border border-red-700/50 rounded-xl p-3 text-red-300 text-center text-sm mb-4 animate-shake">
    {{ error }}
  </div>

  <!-- Loading -->
  <div *ngIf="loadingAuth" class="flex items-center gap-2 text-white mb-4">
    <span class="animate-spin material-symbols-outlined">sync</span> Verificando...
  </div>

  <!-- Keypad -->
  <div class="w-full max-w-[280px] mx-auto mt-2">
    <div class="grid grid-cols-3 gap-y-4 gap-x-6">
      <button *ngFor="let digit of digits"
        (click)="addPinDigit(digit)"
        [disabled]="loadingAuth || pinValue.length >= maxPinLength"
        class="group flex items-center justify-center aspect-square rounded-full bg-white/5 hover:bg-white/10 active:bg-primary/40 transition-all duration-150 backdrop-blur-sm border border-white/5 shadow-lg active:scale-95 disabled:opacity-30">
        <span class="text-2xl font-medium text-white">{{ digit }}</span>
      </button>
      <div class="flex items-center justify-center aspect-square">
        <button (click)="clearPin()" class="text-primary hover:text-white active:scale-90 transition-all p-3 rounded-full hover:bg-white/5">
          <span class="material-symbols-outlined text-[28px]">password</span>
        </button>
      </div>
      <button (click)="addPinDigit(0)" [disabled]="loadingAuth || pinValue.length >= maxPinLength"
        class="group flex items-center justify-center aspect-square rounded-full bg-white/5 hover:bg-white/10 active:bg-primary/40 transition-all duration-150 backdrop-blur-sm border border-white/5 shadow-lg active:scale-95 disabled:opacity-30">
        <span class="text-2xl font-medium text-white">0</span>
      </button>
      <div class="flex items-center justify-center aspect-square">
        <button (click)="removePinDigit()" [disabled]="loadingAuth || pinValue.length === 0"
          class="text-white/60 hover:text-white active:scale-90 transition-all p-3 rounded-full hover:bg-white/5 disabled:opacity-30">
          <span class="material-symbols-outlined text-[28px]">backspace</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Attempts
  <div *ngIf="attempts > 0" class="flex items-center gap-2 mt-6">
    <span class="text-xs text-slate-400">Intentos restantes:</span>
    <div class="flex gap-1">
      <div *ngFor="let i of [0,1,2]"
        [ngClass]="i < getRemainingAttempts() ? 'bg-green-500' : 'bg-red-500/50'"
        class="w-2 h-2 rounded-full"></div>
    </div>
  </div>
  -->
  <!-- Forgot PIN
  <div class="mt-4">
    <button class="text-sm font-semibold text-white/50 hover:text-primary transition-colors py-2 px-4 rounded-lg">
      ¿Olvidaste tu PIN?
    </button>
  </div>
  -->
</div>
